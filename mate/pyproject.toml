[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mate-bench"
version = "0.1.0"
description = "Email corpus with coupled attachments, versions and labelled evidence, and its evaluation harness (PFE ESI x TH Deggendorf)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "jsonschema>=4.20"]

[project.optional-dependencies]
files = ["reportlab>=4.0", "python-docx>=1.1", "openpyxl>=3.1", "matplotlib>=3.8", "pillow>=10.0"]
dev = ["pytest>=8"]

[project.scripts]
mate = "mate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
